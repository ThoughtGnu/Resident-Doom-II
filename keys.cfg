// Resident Doom II key setup. play.bat loads this every time the game starts,
// so edit it here if you want different keys. (Lines are GZDoom console
// commands; "+name" means "while held".)

// Tank controls
bind uparrow +forward
bind downarrow +back
bind leftarrow +left
bind rightarrow +right
bind w +forward
bind s +back
bind a +left
bind d +right

// Run (hold with Up), Aim (hold), Action / fire while aiming (E), Jump (Space)
bind shift +speed
bind ctrl +user1
bind mouse2 +user1
bind space +jump
bind c +crouch
bind e +use

// Inventory screen
bind tab re_inventory
bind i re_inventory

// First-person view on/off (V). In first person the mouse looks around;
// with the fixed cameras it does nothing.
bind v re_view
bind m re_map

// T is GZDoom's chat key, which does nothing in a single-player game and would
// swallow the typed cheat codes (starsteam, rocketman).
unbind t

// Strafe left / right in first person (Q / R; E is Action).
bind q +moveleft
bind r +moveright

// Dark lighting on/off (L). Same as the console command re_lights.
bind l re_lights

// Weapons with the All Weapons cheat: 1-6 and the mouse wheel.
bind 1 "slot 1"
bind 2 "slot 2"
bind 3 "slot 3"
bind 4 "slot 4"
bind 5 "slot 5"
bind 6 "slot 6"
bind 7 "slot 7"
bind mwheelup weapprev
bind mwheeldown weapnext

// Quicksave (F6): GZDoom's own. In the Typewriter and Classic RE save modes it
// only says to find a typewriter (RE_Typewriter.zs).
bind f6 quicksave
bind mouse1 +attack

// No always-run in RE1 (CapsLock still switches it, with an "Always run: ON /
// OFF" message instead of GZDoom's console line)
cl_run 0
alias re_togglerun re_runon
bind capslock re_togglerun
freelook 1

// Mouse in the menus: hovering highlights an item, left-click picks it.
m_use_mouse 1
